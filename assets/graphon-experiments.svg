<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-labelledby="title desc">
<title id="title">Graphon experiments in numbers</title>
<desc id="desc">The reported graphon-space run contains 120,000 samples across two models with one through six pods. These are numerical experiments, not proofs of global optimality.</desc>
<rect width="1000" height="176" rx="14" fill="#0b1020"/>
<rect x=".5" y=".5" width="999" height="175" rx="13.5" fill="none" stroke="#283449"/>
<g font-family="Consolas,Menlo,monospace" font-size="11" fill="#9caac2" letter-spacing="1.2">
<text x="32" y="29">GRAPHON-SPACE / REPORTED NUMERICAL RUN</text>
</g>
<path d="M 330 52 V 127 M 650 52 V 127" stroke="#283449"/>
<g font-family="Georgia,Times New Roman,serif" font-size="46" fill="#f2eee6">
<text x="32" y="88">120,000</text><text x="364" y="88" fill="#79e6db">2</text><text x="684" y="88" fill="#ebc27d">1–6</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#9caac2">
<text x="34" y="116">sampled graphons</text><text x="364" y="116">constrained-density models</text><text x="684" y="116">pods per sampled graphon</text>
</g>
<path d="M 32 139 H 968" stroke="#283449"/>
<text x="32" y="160" fill="#9caac2" font-family="Segoe UI,Arial,sans-serif" font-size="11">60,000 samples per model · Edge–triangle and edge–2-star · Numerical exploration; not a global-optimality proof</text>
</svg>
