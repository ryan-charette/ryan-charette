<title id="title">Three mathematical perspectives</title>
<desc id="desc">Three schematic panels: an ideal triangle in the Poincaré disk; a symmetric block graphon; and a proof that if n equals 2k for an integer k, then n squared is even. These are illustrative mathematical diagrams, not research results.</desc>
